<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">
        <div class="login-card">

            <div class="login-header">
                <h2>SGM</h2>
                <p class="subtitle">Sistema de Gerenciamento de Manutenção</p>
                <p class="school-tag">CE Wanderillo de Castro Câmara</p>
            </div>

            <div id="view-profiles" class="login-view">
                <p class="view-instruction">Selecione o seu perfil para acessar:</p>

                <div class="profile-buttons-grid">
                    <button class="btn-profile" data-role="admin">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                        </svg>
                        Administrador
                    </button>

                    <button class="btn-profile" data-role="tecnico">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path
                                d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.3C.4 6.7.9 9.8 2.9 11.8c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.6z" />
                        </svg>
                        Técnico de Manutenção
                    </button>

                    <button class="btn-profile" data-role="almoxarifado">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path
                                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z" />
                        </svg>
                        Almoxarifado
                    </button>

                    <button class="btn-profile" data-role="usuario">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                        Usuário (Chão de Fábrica)
                    </button>
                </div>
            </div>

            <div id="view-form" class="login-view hidden">
                <div class="form-header-back">
                    <button id="btn-back" class="btn-back">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Voltar
                    </button>
                    <h3 id="form-title">Login</h3>
                </div>

                <form id="form-login-credentials">
                    <div class="input-group">
                        <label for="txt-usuario">Matrícula ou Usuário</label>
                        <input type="text" id="txt-usuario" placeholder="Digite sua identificação" required>
                    </div>

                    <div class="input-group">
                        <label for="txt-senha">Senha de Acesso</label>
                        <input type="password" id="txt-senha" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">
                        Entrar no Sistema
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script src="mockDb.js"></script>
    <script src="login.js"></script>
</body>

</html>
